# Read by /usr/bin/google-chrome-stable (Arch wrapper), one flag per line.

# Chrome's GPU blocklist disables WebGPU on this stack via the
# `webgpu_on_vk_via_gl_interop` entry: the display compositor runs on GL while
# Dawn runs on Vulkan, so WebGPU needs GL interop, which is blocklisted on
# NVIDIA proprietary. Result: navigator.gpu exists, requestAdapter() -> null.
#
# The alternative — enabling Vulkan for the compositor (chrome://flags#enable-vulkan
# or --enable-features=Vulkan) — black-screens every Chrome window under Wayland:
#   ui/ozone/platform/wayland/gpu/wayland_surface_factory.cc:251
#   "'--ozone-platform=wayland' is not compatible with Vulkan."
# Ozone/Wayland has no Vulkan surface support upstream, so that path is out.
#
# Lifting the blocklist keeps native Wayland and gives a real adapter
# (vendor nvidia, architecture lovelace, isFallbackAdapter false).
#
# Side effect: this lifts the *whole* blocklist, not just the WebGPU entry. The
# only other entry active here is accelerated video encode. Hardware video
# decode is unaffected and stays on the NVD_BACKEND=egl path (see docs/desktop.md).
--ignore-gpu-blocklist
